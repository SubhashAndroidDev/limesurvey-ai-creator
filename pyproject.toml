[project]
name = "limesurvey-ai-creator"
version = "1.0.0"
description = "Open-source AI survey creator for LimeSurvey (Python, LangGraph, Ollama)"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "lxml>=5.0",
    "requests>=2.31",
    "streamlit>=1.40",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# This is an application, not a library: uv only installs the dependencies, not the project itself.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
